name: Phase 5 DB Verification

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/phase5-db-verify.yml"

jobs:
  pgtap:
    name: pgTAP suites (Docker-capable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Run Node-level script tests (runner unit tests + confidence backfill binding check)
        run: |
          node --test supabase/scripts/run-isolated-db-suite.test.js
          node --test supabase/scripts/verify-confidence-backfill-binding.test.js

      - name: Start local Supabase stack
        run: supabase start

      - name: Run standard pgTAP suites (Phase 3/4/5, excluding suites requiring the disposable isolated runner)
        run: |
          supabase test db \
            supabase/tests/phase3_read_rpcs.test.sql \
            supabase/tests/phase4_access_code.test.sql \
            supabase/tests/phase4_submit.test.sql \
            supabase/tests/phase5prep_legacy_radius_rpcs_dropped.test.sql \
            supabase/tests/phase5prep_verification_events_lockdown.test.sql \
            supabase/tests/phase5_event_model.test.sql \
            supabase/tests/phase5_discovery.test.sql \
            supabase/tests/phase5_confidence.test.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

      - name: Run isolated dblink cooldown-race suite
        run: node supabase/scripts/run-isolated-db-suite.js supabase/tests/phase5_discovery_cooldown_race.test.sql

      - name: Run isolated verify/publish suite (commits and restores global app_config)
        run: node supabase/scripts/run-isolated-db-suite.js supabase/tests/phase5_verify_publish.test.sql
